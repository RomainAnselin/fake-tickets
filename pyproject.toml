[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-tickets"
version = "2.0.0"
description = "Kubernetes-friendly Cassandra / DSE / Astra data simulator (fake tickets v2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cassandra-driver>=3.29,<4",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "ldap3>=2.9,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
faketickets = "faketickets.__main__:main"

[tool.setuptools.packages.find]
include = ["faketickets*"]

[tool.setuptools.package-data]
faketickets = ["frontend/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a live Cassandra (set FT_IT_CONTACT_POINTS=host[:port])",
]
addopts = "-ra"
