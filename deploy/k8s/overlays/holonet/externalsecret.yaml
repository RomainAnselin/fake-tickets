# App secrets from OpenBao (kv/lab/fake-tickets), written by the homelab's seed script
# (homelab repo, docs/fake-tickets.md). The Secret name and keys match what the base expects.
#
# FT_MASTER_KEY encrypts every saved connection: losing it makes them unreadable. Its
# canonical copy is in Bitwarden. FT_ADMIN_PASSWORD is only used if FT_AUTH_MODE is switched
# to local (break-glass when the directory is down).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fake-tickets-secrets
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: fake-tickets-secrets
  data:
    - secretKey: FT_MASTER_KEY
      remoteRef: {key: lab/fake-tickets, property: master-key}
    - secretKey: FT_BACKEND_TOKEN
      remoteRef: {key: lab/fake-tickets, property: backend-token}
    - secretKey: FT_ADMIN_PASSWORD
      remoteRef: {key: lab/fake-tickets, property: admin-password}
