apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frontend-data
spec:
  accessModes: [ReadWriteOnce]   # SQLite connection vault; block storage, not NFS
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app.kubernetes.io/name: fake-tickets, app.kubernetes.io/component: frontend}
spec:
  replicas: 1                     # SQLite: single writer
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: fake-tickets, app.kubernetes.io/component: frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fake-tickets, app.kubernetes.io/component: frontend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 0
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: fake-tickets
          args: ["frontend"]
          ports: [{name: http, containerPort: 8443}]
          envFrom:
            - configMapRef: {name: fake-tickets-config}
          env:
            - name: FT_MASTER_KEY
              valueFrom: {secretKeyRef: {name: fake-tickets-secrets, key: FT_MASTER_KEY}}
            - name: FT_BACKEND_TOKEN
              valueFrom: {secretKeyRef: {name: fake-tickets-secrets, key: FT_BACKEND_TOKEN}}
            - name: FT_LDAP_BIND_PASSWORD
              valueFrom: {secretKeyRef: {name: fake-tickets-secrets, key: FT_LDAP_BIND_PASSWORD, optional: true}}
            - name: FT_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: fake-tickets-secrets, key: FT_ADMIN_PASSWORD, optional: true}}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: frontend-data}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {app.kubernetes.io/name: fake-tickets, app.kubernetes.io/component: frontend}
spec:
  selector: {app.kubernetes.io/name: fake-tickets, app.kubernetes.io/component: frontend}
  ports: [{name: http, port: 8443, targetPort: http}]
