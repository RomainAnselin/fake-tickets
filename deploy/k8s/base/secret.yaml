# Replace these values before applying (or manage this Secret with SealedSecrets /
# External Secrets). Generate values with:  podman run --rm <image> genkey
#
# FT_MASTER_KEY encrypts every stored DB credential and Astra bundle. Losing it makes
# saved connections unreadable — back it up. The placeholder below is deliberately too
# short: the frontend refuses to start until it is replaced.
apiVersion: v1
kind: Secret
metadata:
  name: fake-tickets-secrets
type: Opaque
stringData:
  FT_MASTER_KEY: REPLACE_ME
  FT_BACKEND_TOKEN: REPLACE_ME_TOO
  FT_LDAP_BIND_PASSWORD: ""
  FT_ADMIN_PASSWORD: ""
