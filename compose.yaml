# Local stack: Cassandra 5 + backend + frontend. See README "Option 1".
#   podman build -t localhost/fake-tickets:2.0.0 .
#   .env with FT_MASTER_KEY and FT_BACKEND_TOKEN (optional: FT_UI_PORT, FT_AUTH_MODE, FT_ADMIN_USER/PASSWORD)
#   podman-compose up -d      -> http://localhost:8443, connection to host "cassandra", port 9042, RF 1
name: fake-tickets

services:
  cassandra:
    image: docker.io/library/cassandra:5.0
    environment:
      MAX_HEAP_SIZE: 640M
      HEAP_NEWSIZE: 128M
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    mem_limit: 1600m
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20

  backend:
    image: localhost/fake-tickets:2.0.0
    command: ["backend"]
    environment:
      FT_BACKEND_TOKEN: ${FT_BACKEND_TOKEN:?set FT_BACKEND_TOKEN}
      FT_MAX_RUNS: "8"
    volumes:
      - backend-data:/data
    depends_on:
      cassandra:
        condition: service_healthy
    stop_grace_period: 40s

  frontend:
    image: localhost/fake-tickets:2.0.0
    command: ["frontend"]
    environment:
      FT_BACKEND_URL: http://backend:8444
      FT_BACKEND_TOKEN: ${FT_BACKEND_TOKEN:?set FT_BACKEND_TOKEN}
      FT_MASTER_KEY: ${FT_MASTER_KEY:?set FT_MASTER_KEY}
      FT_AUTH_MODE: ${FT_AUTH_MODE:-none}
      FT_ADMIN_USER: ${FT_ADMIN_USER:-}
      FT_ADMIN_PASSWORD: ${FT_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${FT_UI_PORT:-8443}:8443"
    volumes:
      - frontend-data:/data
    depends_on:
      - backend

volumes:
  backend-data:
  frontend-data:
