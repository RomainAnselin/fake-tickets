# Container image: test, build, and (on a version tag) publish to ghcr.io.
#
#   pull request / push to main  -> test stage + runtime build, nothing pushed
#   git tag v2.0.1 && git push origin v2.0.1
#                                -> same, then push ghcr.io/romainanselin/fake-tickets:2.0.1, :2.0, :sha-<short>
#
# The tag must match pyproject.toml's version. No personal token: the workflow's own
# GITHUB_TOKEN gets packages:write for this run only. See docs/05-BUILD-AND-RELEASE.md.
name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/romainanselin/fake-tickets   # registry paths must be lowercase

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to ghcr.io (used only on tags)
    steps:
      - uses: actions/checkout@v7

      - name: Version (pyproject.toml; must equal the tag when releasing)
        id: ver
        run: |
          v=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $v"; exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Test stage (the unit suite runs inside the image build)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime image (push on a version tag)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          build-args: VERSION=${{ steps.ver.outputs.version }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true                 # SPDX bill of materials, attached to the image
          provenance: mode=max       # SLSA build provenance, attached to the image
          cache-from: type=gha
